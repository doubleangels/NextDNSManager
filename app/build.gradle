plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "io.sentry.android.gradle" version "6.24.0"
    id "com.google.gms.google-services"
}

android {
    compileSdk = 37
    defaultConfig {
        applicationId "com.doubleangels.nextdnsmanagement"
        minSdkVersion 32
        targetSdk = 37
        versionCode 274
        versionName "5.5.25"
        resourceConfigurations += ["en", "zh", "nl", "fi", "fr", "de", "in", "it", "ja", "pl", "pt", "es", "sv", "tr"]
    }

    productFlavors {
        flavorDimensions "version"
        gms {
            dimension "version"
            applicationId "com.doubleangels.nextdnsmanagement"
        }
        foss {
            dimension "version"
            applicationId "com.doubleangels.nextdnsmanagement"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }
    namespace = 'com.doubleangels.nextdnsmanagement'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    dependenciesInfo {
        includeInApk = true
        includeInBundle = true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.compose.ui:ui:1.12.1'
    implementation 'androidx.compose.foundation:foundation:1.12.1'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0'
    gmsImplementation 'com.google.firebase:firebase-messaging:26.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'io.sentry:sentry-android:8.61.0'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}

def sentryUploadEnabled = System.getenv("SENTRY_AUTH_TOKEN") != null

sentry {
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
    includeProguardMapping = true
    autoUploadProguardMapping = sentryUploadEnabled
    uploadNativeSymbols = sentryUploadEnabled
    autoUploadNativeSymbols = sentryUploadEnabled
    includeNativeSources = sentryUploadEnabled
    includeSourceContext = sentryUploadEnabled
    ignoredBuildTypes = ["debug"]
}

afterEvaluate {
    tasks.matching { task ->
        task.name.startsWith("processFoss") && task.name.endsWith("GoogleServices")
    }.configureEach { task ->
        task.enabled = false
    }
}
