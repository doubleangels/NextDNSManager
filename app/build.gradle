plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.sentry.android.gradle)
    alias(libs.plugins.google.services)
}

android {
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }
    defaultConfig {
        applicationId "com.doubleangels.nextdnsmanagement"
        minSdkVersion 32
        targetSdk = 37
        versionCode 274
        versionName "5.5.25"

        def sentryRelease = "${applicationId}@${versionName}+${versionCode}"
        buildConfigField "String", "SENTRY_RELEASE", "\"${sentryRelease}\""
        resourceConfigurations += ["en", "zh", "nl", "fi", "fr", "de", "in", "it", "ja", "pl", "pt", "es", "sv", "tr"]
    }

    productFlavors {
        flavorDimensions "version"
        gms {
            dimension "version"
            applicationId "com.doubleangels.nextdnsmanagement"
        }
        foss {
            dimension "version"
            applicationId "com.doubleangels.nextdnsmanagement"
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "SENTRY_DSN", "\"${resolveSentryDsnForDebug()}\""
        }
        release {
            buildConfigField "String", "SENTRY_DSN", "\"${resolveSentryDsnForRelease()}\""
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }
    namespace = 'com.doubleangels.nextdnsmanagement'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    dependenciesInfo {
        includeInApk = true
        includeInBundle = true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation libs.activity
    implementation libs.core
    implementation libs.appcompat
    implementation libs.biometric
    implementation libs.preference
    implementation libs.security.crypto
    implementation libs.core.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.webkit
    implementation libs.material
    gmsImplementation libs.firebase.messaging
    implementation libs.okhttp
    implementation libs.circleimageview
    implementation libs.profileinstaller
    implementation libs.sentry.android
    debugImplementation libs.leakcanary.android
}

def resolveSentryDsnForRelease() {
    def ciDsn = System.getenv("SENTRY_DSN")
    if (ciDsn != null && !ciDsn.trim().isEmpty()) {
        return ciDsn.trim()
    }
    // Public DSN used when no SENTRY_DSN is provided. F-Droid builds the release
    // from source without CI secrets, and those users must still be able to opt in
    // to error reporting. A Sentry DSN only allows sending events, so it is safe
    // to publish.
    return "https://8b52cc2148b94716a69c9a4f0c0b4513@o244019.ingest.us.sentry.io/6270764"
}

// Debug builds only report when a DSN is configured locally, so development
// crashes stay out of the production project.
def resolveSentryDsnForDebug() {
    def ciDsn = System.getenv("SENTRY_DSN")
    if (ciDsn != null && !ciDsn.trim().isEmpty()) {
        return ciDsn.trim()
    }
    def fromFile = readSentryDsnLocalFile()
    if (!fromFile.isEmpty()) {
        return fromFile
    }
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
        def fromLocal = localProps.getProperty("sentry.dsn")
        if (fromLocal != null && !fromLocal.trim().isEmpty()) {
            return fromLocal.trim()
        }
    }
    return ""
}

def readSentryDsnLocalFile() {
    def dsnFile = rootProject.file("sentry.dsn.local")
    if (!dsnFile.exists()) {
        return ""
    }
    for (line in dsnFile.readLines()) {
        def trimmed = line.trim()
        if (!trimmed.isEmpty() && !trimmed.startsWith("#")) {
            return trimmed
        }
    }
    return ""
}

def sentryUploadEnabled = System.getenv("SENTRY_AUTH_TOKEN") != null

sentry {
    org = "doubleangels"
    projectName = "nextdns-manager"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
    includeProguardMapping = true
    autoUploadProguardMapping = sentryUploadEnabled
    includeSourceContext = sentryUploadEnabled
    ignoredBuildTypes = ["debug"]
    telemetry = false
    // Auto-instrumentation wrapped every OkHttp call (including the test.nextdns.io
    // connectivity probe) and reported expected network failures as errors.
    tracingInstrumentation {
        enabled = false
        logcat {
            enabled = false
        }
    }
    // sentry-android is declared explicitly in the version catalog.
    autoInstallation {
        enabled = false
    }
}

afterEvaluate {
    tasks.matching { task ->
        task.name.startsWith("processFoss") && task.name.endsWith("GoogleServices")
    }.configureEach { task ->
        task.enabled = false
    }
}
