org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
# Lets Gradle reuse task outputs from a previous build (local or, in CI, the
# cache restored by setup-java) instead of re-running unchanged work.
org.gradle.caching=true
# Caches the result of the configuration phase itself (plugin application,
# task graph) so an unchanged build can skip straight to task execution.
org.gradle.configuration-cache=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false
