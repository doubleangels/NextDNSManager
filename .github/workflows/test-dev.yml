name: Development Build Testing

on:
  push:
    branches:
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # dev is already tested on push; skip the duplicate run on dev -> main PRs.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Run unit tests
        run: ./gradlew test --no-daemon

  lint:
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Run Android Lint
        run: ./gradlew lintGmsRelease lintFossRelease --no-daemon

  build:
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Build release APKs
        run: ./gradlew assembleGmsRelease assembleFossRelease --no-daemon
