name: Verify signing certificate
description: >-
  Fails when a signed APK or AAB is not signed with the expected production
  certificate. Skips with a warning when the expected fingerprint is not set.

inputs:
  file:
    description: Path to the signed .apk or .aab.
    required: true
  expected-sha256:
    description: Expected SHA-256 certificate fingerprint (colons and case are ignored).
    required: false
    default: ""
  build-tools-version:
    description: Android build-tools version that provides apksigner (APKs only).
    required: false
    default: "37.0.0"

runs:
  using: composite
  steps:
    - name: Compare certificate fingerprint
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        EXPECTED: ${{ inputs.expected-sha256 }}
        BUILD_TOOLS_VERSION: ${{ inputs.build-tools-version }}
      run: |
        set -euo pipefail
        if [ -z "${EXPECTED}" ]; then
          echo "::warning::PRODUCTION_SIGNING_CERT_SHA256 secret is not set, skipping signing certificate verification for ${FILE}."
          exit 0
        fi
        case "${FILE}" in
          *.apk)
            # minSdk 32 APKs carry only v2+ signatures, which keytool cannot read.
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            ACTUAL=$("${SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --print-certs "${FILE}" \
              | grep -m1 -oP 'certificate SHA-256 digest:\s*\K[0-9A-Fa-f]+' || true)
            ;;
          *.aab)
            ACTUAL=$(keytool -printcert -jarfile "${FILE}" 2>/dev/null \
              | grep -m1 -oP 'SHA256:\s*\K[0-9A-Fa-f:]+' || true)
            ;;
          *)
            echo "::error::Unsupported file type: ${FILE}"
            exit 1
            ;;
        esac
        ACTUAL=$(echo -n "${ACTUAL}" | tr -d ':' | tr '[:lower:]' '[:upper:]')
        EXPECTED=$(echo -n "${EXPECTED}" | tr -d ': ' | tr '[:lower:]' '[:upper:]')
        if [ -z "${ACTUAL}" ]; then
          echo "::error::Could not read a certificate fingerprint from ${FILE}."
          exit 1
        fi
        if [ "${ACTUAL}" != "${EXPECTED}" ]; then
          echo "::error::${FILE} certificate fingerprint (${ACTUAL}) does not match the expected production signing certificate (${EXPECTED}). Refusing to publish."
          exit 1
        fi
        echo "Verified ${FILE} matches the expected production signing certificate."
